services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped

    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      # HTTP
      - --entrypoints.web.address=:80

      # HTTPS
      - --entrypoints.websecure.address=:443

      # HTTP -> HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      # Let's Encrypt
      - --certificatesresolvers.letsencrypt.acme.email=imrans456321@gmail.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

      - --api.dashboard=true
      - --log.level=INFO

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

    networks:
      - web


  # ============================================================
  # FastAPI
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fastapi
    restart: unless-stopped

    expose:
      - "8000"

    volumes:
      - ./images:/app/images

    environment:
      MONGO_URL: mongodb://mongo:27017/${MONGO_DB}
      REDIS_URL: redis://redis:6379/0
      API_SECRET: ${API_SECRET}

    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

    labels:
      - traefik.enable=true

      # Tell Traefik which Docker network to use
      - traefik.docker.network=lrn4chg-web

      # Router
      - traefik.http.routers.fastapi.rule=Host(`api.lrn4chng.site`)
      - traefik.http.routers.fastapi.entrypoints=websecure
      - traefik.http.routers.fastapi.tls=true
      - traefik.http.routers.fastapi.tls.certresolver=letsencrypt

      # FastAPI container port
      - traefik.http.services.fastapi.loadbalancer.server.port=8000

    networks:
      - web
      - backend


  # ============================================================
  # MongoDB
  # ============================================================
  mongo:
    image: mongo:8
    container_name: mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}

    volumes:
      - mongo_data:/data/db

    # MongoDB is intentionally NOT exposed to the host.
    # FastAPI accesses it through the backend Docker network.

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    # Redis is intentionally NOT exposed to the host.
    # FastAPI accesses it through the backend Docker network.

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend


# ==============================================================
# Volumes
# ==============================================================
volumes:
  mongo_data:
    name: lrn4chg-mongo-data

  redis_data:
    name: lrn4chg-redis-data


# Networks
networks:
  # Public-facing network.
  # Traefik and services that need to receive HTTP traffic join this.
  web:
    name: lrn4chg-web
    driver: bridge

  # Private application network.
  # MongoDB, Redis, FastAPI, etc. can communicate here.
  backend:
    name: lrn4chg-backend
    driver: bridge